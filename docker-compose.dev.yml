# Entorno de DESARROLLO (capítulo 8, Guideline 6).
#
# Cambia la imagen de producción por la de construcción y monta el código
# fuente dentro de los contenedores: se edita en el host y se ejecuta en el
# contenedor, sin reconstruir la imagen cada vez.
#
#   make dev
#
# o, sin make:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Las direcciones son las mismas que en producción (la aplicación sigue en
# http://localhost:9080), así que no hay que cambiar de URL para probar.
#
# Aquí solo se añaden los puertos del depurador: Docker Compose CONCATENA las
# listas de puertos entre archivos, así que repetir los del compose base
# provocaría un choque.
#
# El volumen anónimo sobre /app/node_modules evita que el montaje del host
# tape las dependencias instaladas dentro de la imagen.

services:
  ms-auth:
    build: { target: construccion }
    volumes: ["./services/ms-auth/src:/app/src", "/app/node_modules"]
    ports: ["9231:9229"]

  ms-galerias:
    build: { target: construccion }
    volumes: ["./services/ms-galerias/src:/app/src", "/app/node_modules"]
    ports: ["9232:9229"]

  ms-media:
    build: { target: construccion }
    volumes: ["./services/ms-media/src:/app/src", "/app/node_modules"]
    ports: ["9233:9229"]

  ms-seleccion:
    build: { target: construccion }
    volumes: ["./services/ms-seleccion/src:/app/src", "/app/node_modules"]
    ports: ["9234:9229"]

  ms-notificaciones:
    build: { target: construccion }
    volumes: ["./services/ms-notificaciones/src:/app/src", "/app/node_modules"]
    ports: ["9235:9229"]

  # En Go no hay vigilante: compila en segundo y medio, asi que para ver un
  # cambio basta con 'docker compose restart ms-pagos'.
  ms-pagos:
    build: { target: construccion }
    volumes: ["./services/ms-pagos:/app"]

  gateway:
    build: { target: construccion }
    volumes: ["./gateway/src:/app/src", "/app/node_modules"]
    ports: ["9230:9229"]

  # Vite escucha en el 80, igual que nginx en produccion: misma direccion.
  frontend:
    build: { target: construccion }
    volumes: ["./frontend/src:/app/src", "/app/node_modules"]
