# Galería Privada · todo el sistema con un solo comando (RNF-16):
#
#   docker compose up --build
#
# Después:
#   http://localhost:9080        la aplicación (entra por Traefik)
#   http://localhost:8081        panel de Traefik: que rutas hay y a donde van
#   http://localhost:9080/docs   contrato del gateway
#   http://localhost:8025        bandeja de correo de prueba (Mailpit)
#   http://localhost:15672       panel de RabbitMQ (galeria / galeria)
#   http://localhost:9001        consola del almacen de archivos (galeriaprivada / galeriaprivada2026)

name: galeria-privada

x-postgres: &postgres
  DB_HOST: postgres
  DB_PORT: 5432

x-broker: &broker
  RABBITMQ_URL: amqp://galeria:galeria@rabbitmq:5672

services:
  # ------------------------------------------------------------------- entrada
  # Edge router: recibe TODO el trafico y decide a que contenedor va, segun la
  # URL. No sustituye al API Gateway, trabaja delante de el:
  #
  #   Traefik  -> enruta por direccion. Es capa de red.
  #   Gateway  -> valida el token y orquesta. Es capa de negocio.
  #
  # Descubre los servicios solo, leyendo el socket de Docker: cuando un
  # contenedor con la etiqueta traefik.enable=true arranca, Traefik lo ve en
  # milisegundos y empieza a enrutar hacia el, sin reiniciar nada.
  traefik:
    image: traefik:v3.6
    command:
      # Panel de control sin contrasena: solo para desarrollo local.
      - "--api.insecure=true"
      # Escucha a Docker para descubrir servicios automaticamente.
      - "--providers.docker=true"
      # Ignora todo contenedor que no lo pida expresamente con una etiqueta.
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
    ports:
      - "9080:80"     # la puerta del sistema
      - "8081:8080"   # el panel de control
    volumes:
      # Solo lectura: Traefik necesita ver que contenedores hay, nada mas.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------------------------------------------------------------- infraestructura
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      # Crea una base y un usuario por servicio la primera vez (ADR 0003).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: galeria
      RABBITMQ_DEFAULT_PASS: galeria
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Almacenamiento de archivos compatible con S3 (ADR 0005, ADR 0010).
  # Antes era MinIO; sus imagenes desaparecieron de Docker Hub en septiembre
  # de 2026, asi que se usa RustFS, que habla el mismo protocolo S3 y mantiene
  # los mismos puertos: 9000 para la API y 9001 para la consola web.
  almacen:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: galeriaprivada
      RUSTFS_SECRET_KEY: galeriaprivada2026
    volumes:
      - datos-almacen:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # Base de datos de ms-pagos. Es documental y no relacional a proposito:
  # persistencia poliglota, cada servicio elige el motor que le conviene
  # (capitulo 8, Guideline 3 y Guideline 5).
  mongodb:
    image: mongo:7
    volumes:
      - datos-mongo:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Servidor de correo de prueba: recoge los correos en una bandeja web en lugar
  # de enviarlos de verdad.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------------------------------------------------------------- microservicios
  ms-auth:
    build:
      context: ./services/ms-auth
      target: prod
    environment:
      <<: [*postgres, *broker]
      PORT: 3001
      DB_USER: auth_user
      DB_PASSWORD: auth_pass
      DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo}
      JWT_EXPIRA_EN: 12h
    ports:
      - "3001:3001"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  ms-galerias:
    build:
      context: ./services/ms-galerias
      target: prod
    environment:
      <<: [*postgres, *broker]
      PORT: 3002
      DB_USER: galerias_user
      DB_PASSWORD: galerias_pass
      DB_NAME: galerias_db
    ports:
      - "3002:3002"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  ms-media:
    build:
      context: ./services/ms-media
      target: prod
    environment:
      <<: [*postgres, *broker]
      PORT: 3003
      DB_USER: media_user
      DB_PASSWORD: media_pass
      DB_NAME: media_db
      ALMACEN_ENDPOINT: http://almacen:9000
      # El navegador no resuelve "almacen": las URLs firmadas se reescriben a esta.
      ALMACEN_ENDPOINT_PUBLICO: ${ALMACEN_ENDPOINT_PUBLICO:-http://localhost:9000}
      ALMACEN_ACCESS_KEY: galeriaprivada
      ALMACEN_SECRET_KEY: galeriaprivada2026
      ALMACEN_BUCKET_ORIGINALES: originales
      ALMACEN_BUCKET_MINIATURAS: miniaturas
      URL_MINIATURA_SEGUNDOS: 3600
      URL_ORIGINAL_SEGUNDOS: 900
    ports:
      - "3003:3003"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      almacen: { condition: service_started }
    restart: unless-stopped

  ms-seleccion:
    build:
      context: ./services/ms-seleccion
      target: prod
    environment:
      <<: [*postgres, *broker]
      PORT: 3004
      DB_USER: seleccion_user
      DB_PASSWORD: seleccion_pass
      DB_NAME: seleccion_db
    ports:
      - "3004:3004"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  ms-notificaciones:
    build:
      context: ./services/ms-notificaciones
      target: prod
    environment:
      <<: [*postgres, *broker]
      PORT: 3005
      DB_USER: notificaciones_user
      DB_PASSWORD: notificaciones_pass
      DB_NAME: notificaciones_db
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # Mailpit es un servidor de prueba: su certificado no está firmado por nadie.
      SMTP_TLS_ESTRICTO: "false"
      CORREO_REMITENTE: Galería Privada <no-responder@galeria.local>
    ports:
      - "3005:3005"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      mailpit: { condition: service_started }
    restart: unless-stopped

  # Unico servicio en Go y sobre MongoDB (capitulo 8, Guideline 3).
  ms-pagos:
    build:
      context: ./services/ms-pagos
      target: prod
    environment:
      PORT: 3006
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: pagos_db
    ports:
      - "3006:3006"
    depends_on:
      mongodb: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- entrada
  gateway:
    build:
      context: ./gateway
      target: prod
    environment:
      <<: *broker
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-secreto-de-desarrollo}
      MS_AUTH_URL: http://ms-auth:3001
      MS_GALERIAS_URL: http://ms-galerias:3002
      MS_MEDIA_URL: http://ms-media:3003
      MS_SELECCION_URL: http://ms-seleccion:3004
      MS_PAGOS_URL: http://ms-pagos:3006
      # Base de los enlaces privados que se envían al cliente.
      URL_PUBLICA: ${URL_PUBLICA:-http://localhost:9080}
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      # Todo lo que empiece por /api o /docs es del gateway. La prioridad alta
      # hace que gane frente a la regla general del frontend.
      - "traefik.http.routers.gateway.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/health`) || PathPrefix(`/ping`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.routers.gateway.priority=10"
      - "traefik.http.services.gateway.loadbalancer.server.port=3000"
    depends_on:
      rabbitmq: { condition: service_healthy }
      ms-auth: { condition: service_started }
      ms-galerias: { condition: service_started }
      ms-media: { condition: service_started }
      ms-seleccion: { condition: service_started }
      ms-pagos: { condition: service_started }
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    labels:
      - "traefik.enable=true"
      # Regla general: cualquier direccion que no sea del gateway.
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    depends_on:
      gateway: { condition: service_started }
    restart: unless-stopped

volumes:
  datos-postgres:
  datos-almacen:
  datos-mongo:
