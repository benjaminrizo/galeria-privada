# Entorno local de ms-seleccion POR SEPARADO (capitulo 8, Guideline 4).
#
# Levanta solo este servicio con lo minimo que necesita, para trabajar en el
# sin arrancar el sistema entero. El sistema completo se levanta desde el
# repositorio sombrilla.
#
#   make start
#
# El codigo se monta desde tu maquina: editas fuera, se ejecuta dentro.

name: ms-seleccion

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seleccion_user
      POSTGRES_PASSWORD: seleccion_pass
      POSTGRES_DB: seleccion_db
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: galeria
      RABBITMQ_DEFAULT_PASS: galeria
    ports:
      - "5672:5672"

  ms-seleccion:
    build:
      context: .
      target: construccion
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: seleccion_user
      DB_PASSWORD: seleccion_pass
      DB_NAME: seleccion_db
      PORT: 3004
      RABBITMQ_URL: amqp://galeria:galeria@rabbitmq:5672
    ports:
      - "3004:3004"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    depends_on:
      - postgres
      - rabbitmq

volumes:
  datos:
