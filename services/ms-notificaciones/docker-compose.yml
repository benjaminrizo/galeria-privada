# Entorno local de ms-notificaciones POR SEPARADO (capitulo 8, Guideline 4).
#
# Levanta solo este servicio con las piezas de infraestructura que necesita,
# para poder trabajar en el sin arrancar el sistema entero. Para el sistema
# completo se usa el docker-compose.yml del repositorio sombrilla.
#
#   make start      ->  docker compose up -d --build
#
# Monta el codigo fuente del host dentro del contenedor: se edita fuera y se
# ejecuta dentro, con recarga en caliente al guardar (Guideline 6a y 6d).

name: ms-notificaciones
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notificaciones_user
      POSTGRES_PASSWORD: notificaciones_pass
      POSTGRES_DB: notificaciones_db
    volumes:
    - datos-postgres:/var/lib/postgresql/data
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U notificaciones_user
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: galeria
      RABBITMQ_DEFAULT_PASS: galeria
    ports:
    - 5672:5672
    - 15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 12
  mailpit:
    image: axllent/mailpit:latest
    ports:
    - 1025:1025
    - 8025:8025
  ms-notificaciones:
    build:
      context: .
      target: dev
    environment:
      RABBITMQ_URL: amqp://galeria:galeria@rabbitmq:5672
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3005
      DB_USER: notificaciones_user
      DB_PASSWORD: notificaciones_pass
      DB_NAME: notificaciones_db
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_ESTRICTO: 'false'
      CORREO_REMITENTE: Galería Privada <no-responder@galeria.local>
    ports:
    - 3005:3005
    - 9229:9229
    volumes:
    - ./src:/app/src
    - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      mailpit:
        condition: service_started
volumes:
  datos-postgres: null
