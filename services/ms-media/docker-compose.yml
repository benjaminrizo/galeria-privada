# Entorno local de ms-media POR SEPARADO (capitulo 8, Guideline 4).
#
# Levanta solo este servicio con las piezas de infraestructura que necesita,
# para poder trabajar en el sin arrancar el sistema entero. Para el sistema
# completo se usa el docker-compose.yml del repositorio sombrilla.
#
#   make start      ->  docker compose up -d --build
#
# Monta el codigo fuente del host dentro del contenedor: se edita fuera y se
# ejecuta dentro, con recarga en caliente al guardar (Guideline 6a y 6d).

name: ms-media
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media_user
      POSTGRES_PASSWORD: media_pass
      POSTGRES_DB: media_db
    volumes:
    - datos-postgres:/var/lib/postgresql/data
    ports:
    - 5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U media_user
      interval: 5s
      timeout: 5s
      retries: 12
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: galeria
      RABBITMQ_DEFAULT_PASS: galeria
    ports:
    - 5672:5672
    - 15672:15672
    healthcheck:
      test:
      - CMD
      - rabbitmq-diagnostics
      - -q
      - ping
      interval: 10s
      timeout: 10s
      retries: 12
  almacen:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: galeriaprivada
      RUSTFS_SECRET_KEY: galeriaprivada2026
    volumes:
    - datos-almacen:/data
    ports:
    - 9000:9000
    - 9001:9001
  ms-media:
    build:
      context: .
      target: dev
    environment:
      RABBITMQ_URL: amqp://galeria:galeria@rabbitmq:5672
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3003
      DB_USER: media_user
      DB_PASSWORD: media_pass
      DB_NAME: media_db
      ALMACEN_ENDPOINT: http://almacen:9000
      ALMACEN_ENDPOINT_PUBLICO: ${ALMACEN_ENDPOINT_PUBLICO:-http://localhost:9000}
      ALMACEN_ACCESS_KEY: galeriaprivada
      ALMACEN_SECRET_KEY: galeriaprivada2026
      ALMACEN_BUCKET_ORIGINALES: originales
      ALMACEN_BUCKET_MINIATURAS: miniaturas
      URL_MINIATURA_SEGUNDOS: 3600
      URL_ORIGINAL_SEGUNDOS: 900
    ports:
    - 3003:3003
    - 9229:9229
    volumes:
    - ./src:/app/src
    - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      almacen:
        condition: service_started
volumes:
  datos-postgres: null
  datos-almacen: null
