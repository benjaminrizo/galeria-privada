# Entorno local de ms-media POR SEPARADO (capitulo 8, Guideline 4).
#
# Levanta solo este servicio con lo minimo que necesita, para trabajar en el
# sin arrancar el sistema entero. El sistema completo se levanta desde el
# repositorio sombrilla.
#
#   make start
#
# El codigo se monta desde tu maquina: editas fuera, se ejecuta dentro.

name: ms-media

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: media_user
      POSTGRES_PASSWORD: media_pass
      POSTGRES_DB: media_db
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: galeria
      RABBITMQ_DEFAULT_PASS: galeria
    ports:
      - "5672:5672"

  almacen:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: galeriaprivada
      RUSTFS_SECRET_KEY: galeriaprivada2026
    ports:
      - "9000:9000"

  ms-media:
    build:
      context: .
      target: construccion
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: media_user
      DB_PASSWORD: media_pass
      DB_NAME: media_db
      PORT: 3003
      RABBITMQ_URL: amqp://galeria:galeria@rabbitmq:5672
      ALMACEN_ENDPOINT: http://almacen:9000
      ALMACEN_ENDPOINT_PUBLICO: http://localhost:9000
      ALMACEN_ACCESS_KEY: galeriaprivada
      ALMACEN_SECRET_KEY: galeriaprivada2026
      ALMACEN_BUCKET_ORIGINALES: originales
      ALMACEN_BUCKET_MINIATURAS: miniaturas
    ports:
      - "3003:3003"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    depends_on:
      - postgres
      - rabbitmq
      - almacen

volumes:
  datos:
