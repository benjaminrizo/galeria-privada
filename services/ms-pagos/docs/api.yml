openapi: 3.0.3
info:
  title: ms-pagos
  description: >
    Pagos (extra): pedidos de fotos adicionales con pago simulado.
    Contrato de diseño en docs/QueriesYActions/ms-pagos.md
  version: "1.0"
servers:
  - url: http://localhost:3006
    description: Servicio aislado
  - url: http://localhost:3000/api
    description: A través del API Gateway
tags:
  - name: Pedidos
  - name: Salud

paths:
  /ping:
    get:
      tags: [Salud]
      summary: Liveness · el proceso está vivo
      responses:
        "200":
          description: Vivo
  /health:
    get:
      tags: [Salud]
      summary: Readiness · además hay conexión a MongoDB
      responses:
        "200": { description: Listo para recibir tráfico }
        "503": { description: Sin conexión a la base de datos }

  /pedidos:
    post:
      tags: [Pedidos]
      summary: A-PAG-01 · CrearPedido (HU-20)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrearPedido" }
      responses:
        "201":
          description: Pedido creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  pedidoId: { type: string, format: uuid }
                  total:    { type: number, example: 75000 }
                  estado:   { type: string, enum: [pendiente, confirmado] }
        "422":
          description: DATOS_INVALIDOS
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Q-PAG-01 · ObtenerPedido (HU-20)
      parameters: [{ $ref: "#/components/parameters/IdDePedido" }]
      responses:
        "200":
          description: El pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "404":
          description: PEDIDO_NO_ENCONTRADO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /pedidos/{id}/pago-simulado:
    post:
      tags: [Pedidos]
      summary: A-PAG-02 · ConfirmarPagoSimulado (HU-20)
      description: Idempotente — confirmar dos veces deja el mismo resultado.
      parameters: [{ $ref: "#/components/parameters/IdDePedido" }]
      responses:
        "200":
          description: Pedido confirmado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pedido" }
        "404":
          description: PEDIDO_NO_ENCONTRADO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  parameters:
    IdDePedido:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    CrearPedido:
      type: object
      required: [galeriaId, cantidadFotos, precioUnitario]
      properties:
        galeriaId:      { type: string, format: uuid }
        cantidadFotos:  { type: integer, minimum: 1, example: 5 }
        precioUnitario: { type: number, minimum: 0.01, example: 15000 }

    Pedido:
      type: object
      properties:
        pedidoId:       { type: string, format: uuid }
        galeriaId:      { type: string, format: uuid }
        cantidadFotos:  { type: integer }
        precioUnitario: { type: number }
        total:          { type: number }
        estado:         { type: string, enum: [pendiente, confirmado] }
        creadoEn:       { type: string, format: date-time }
        confirmadoEn:   { type: string, format: date-time, nullable: true }

    Error:
      type: object
      description: Formato acordado en docs/QueriesYActions/README.md
      properties:
        codigo:  { type: string, example: PEDIDO_NO_ENCONTRADO }
        mensaje: { type: string }
