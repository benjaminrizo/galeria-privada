# Entorno local de ms-notificaciones POR SEPARADO (capitulo 8, Guideline 4).
#
# Levanta solo este servicio con lo minimo que necesita, para trabajar en el
# sin arrancar el sistema entero. El sistema completo se levanta desde el
# repositorio sombrilla.
#
#   make start
#
# El codigo se monta desde tu maquina: editas fuera, se ejecuta dentro.

name: ms-notificaciones

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notificaciones_user
      POSTGRES_PASSWORD: notificaciones_pass
      POSTGRES_DB: notificaciones_db
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: galeria
      RABBITMQ_DEFAULT_PASS: galeria
    ports:
      - "5672:5672"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  ms-notificaciones:
    build:
      context: .
      target: construccion
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: notificaciones_user
      DB_PASSWORD: notificaciones_pass
      DB_NAME: notificaciones_db
      PORT: 3005
      RABBITMQ_URL: amqp://galeria:galeria@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_TLS_ESTRICTO: 'false'
    ports:
      - "3005:3005"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    depends_on:
      - postgres
      - rabbitmq
      - mailpit

volumes:
  datos:
