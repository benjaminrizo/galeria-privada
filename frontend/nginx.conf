server {
  listen 80;
  server_name _;

  # Las fotos pueden pesar: se deja margen para una subida de varias a la vez.
  client_max_body_size 300M;

  root /usr/share/nginx/html;
  index index.html;

  # Todo lo que empieza por /api va al gateway, el único punto de entrada
  # (ADR 0002). Así el navegador habla con un solo origen.
  location /api/ {
    proxy_pass http://gateway:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # La aplicación es de una sola página: /c/{codigo} también sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
